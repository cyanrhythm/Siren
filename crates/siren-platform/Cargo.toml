[package]
name = "siren-platform"
description = "平台能力层：trait 定义与各平台实现"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
siren-core.workspace = true
playwire.workspace = true
raw-window-handle.workspace = true
png.workspace = true
# 托盘：跨平台 crate（Windows Shell_NotifyIcon / Linux SNI / macOS NSStatusItem）
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Linux 托盘走 ksni（纯 D-Bus），避开 libappindicator/GTK3；见 docs/02 §9
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
