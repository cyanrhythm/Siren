[package]
name = "siren-app"
description = "应用层：GPUI 界面与状态管理"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
siren-core.workspace = true
siren-platform.workspace = true
gpui-kit.workspace = true
tokio.workspace = true
log.workspace = true

# 封面取色（解码封面主色）
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }

[[bin]]
name = "siren"
path = "src/main.rs"

# ── 打包（cargo-packager）──────────────────────────────────────
# 用法：cargo packager -p siren-app --release
# 产物在 target/release/ 下（NSIS 安装包 *.exe）。
# libmpv-2.dll 会被放到安装目录、与 siren.exe 同目录（运行时按 `libmpv-2.dll` 加载）。
# 字体与图标已 include_bytes! 进二进制，无需额外打包。
[package.metadata.packager]
product-name = "Siren"
identifier = "com.cyanrhythm.Siren"
category = "Music"
description = "网易云音乐第三方桌面客户端（Rust + GPUI）"
authors = ["cyanrhythm"]
icons = ["../../assets/icons/siren.ico"]
resources = ["../../assets/native/windows/bin/libmpv-2.dll"]
before-packaging-command = "cargo build --release -p siren-app"
formats = ["nsis"]

[package.metadata.packager.nsis]
# 安装包图标（由 assets/icons/package.svg 生成的多尺寸 ico）。
installer-icon = "../../assets/icons/package.ico"
# 安装界面语言：简体中文优先（可加 "English" 作备选）。
languages = ["SimpChinese"]
# 自定义模板：在默认模板基础上开启 ManifestDPIAware，解决高 DPI 下界面发糊。
template = "packaging/installer.nsi"
