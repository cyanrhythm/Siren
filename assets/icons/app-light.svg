<?xml version="1.0" encoding="UTF-8"?>
<!--
  Siren 应用图标

  设计意象：干净现代
  - 浅灰渐变底：从接近白到浅灰，柔和、干净、无压迫感
  - 符号：红色音乐播放符号，醒目但不刺眼
  - 符号已缩小，四周留白充足

  视图框 1024×1024
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Siren">
  <title>Siren</title>
  <desc>音乐播放器图标：浅灰渐变底上的红色音乐符号</desc>

  <defs>
    <!-- 浅灰渐变：自上而下由近白过渡到浅灰，柔和干净 -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7F8FA"/>
      <stop offset="100%" stop-color="#E5E7EB"/>
    </linearGradient>

    <!-- 左上角极淡的暖光，增加一点层次但不抢符号 -->
    <radialGradient id="softLight" cx="20%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 圆角方形底 -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#softLight)"/>

  <!--
    音乐播放符号（红色，缩小并居中）
    以 512,512 为缩放中心，缩放比例约为 0.7
  -->
  <g fill="#E63946" transform="translate(512 512) scale(0.7) translate(-512 -512)">
    <path d="M512 960A448 448 0 1 1 802.133333 170.666667a42.666667 42.666667 0 0 1-55.466666 65.493333 362.666667 362.666667 0 1 0 112 170.666667l-226.346667 226.133333a170.666667 170.666667 0 1 1 44.16-164.906667l165.546667-167.04a42.666667 42.666667 0 0 1 37.333333-13.653333 42.666667 42.666667 0 0 1 32.426667 23.04A448 448 0 0 1 512 960z m0-533.333333a85.333333 85.333333 0 0 0-60.373333 145.706666 87.466667 87.466667 0 0 0 120.746666 0l2.133334-2.133333 1.066666-1.493333A85.333333 85.333333 0 0 0 512 426.666667z" fill="#E63946"/>
  </g>
</svg>