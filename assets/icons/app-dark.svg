<?xml version="1.0" encoding="UTF-8"?>
<!--
  Siren 应用图标

  设计意象：深色干净现代（纯色平底）
  - 纯深灰底：中性、干净、无渐变
  - 符号：红色音乐播放符号，醒目但不刺眼
  - 符号已缩小，四周留白充足

  视图框 1024×1024
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Siren">
  <title>Siren</title>
  <desc>音乐播放器图标：纯深灰底上的红色音乐符号</desc>

  <!-- 圆角方形纯色底 -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="#1C1E21"/>

  <!--
    音乐播放符号（红色，缩小并居中）
    以 512,512 为缩放中心，缩放比例约为 0.7
  -->
  <g fill="#FF4D4D" transform="translate(512 512) scale(0.7) translate(-512 -512)">
