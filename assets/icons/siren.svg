<?xml version="1.0" encoding="UTF-8"?>
<!--
  Siren 应用图标
  设计意象：深色干净现代（近黑底 + 品牌红符号）
  - 近黑底：#17181C，比纯黑柔和，OLED 上不刺眼
  - 极微径向渐变：中心略亮，避免死平
  - 符号：品牌红 #E5484D，醒目但不刺眼
  - 符号占比约 68%，四周留白均衡
  视图框 1024×1024
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Siren">
  <title>Siren</title>
  <desc>音乐播放器图标：近黑底上的红色音乐符号</desc>

  <defs>
    <!-- 极微径向渐变：中心略亮，边缘略暗 -->
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%"  stop-color="#212329"/>
      <stop offset="100%" stop-color="#151619"/>
    </radialGradient>
  </defs>

  <!-- 圆角方形底 -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" ry="232" fill="url(#bg)"/>

  <!--
    音乐播放符号
    - 缩放 0.76，视觉占比约 68%
    - 颜色 #E5484D（品牌红，比纯红更高级）
    - 以 512,512 为中心缩放
  -->
  <g transform="translate(512 512) scale(0.76) translate(-512 -512)">
    <path fill="#E5484D"
      d="M512 960A448 448 0 1 1 802.133333 170.666667a42.666667 42.666667 0 0 1-55.466666 65.493333 362.666667 362.666667 0 1 0 112 170.666667l-226.346667 226.133333a170.666667 170.666667 0 1 1 44.16-164.906667l165.546667-167.04a42.666667 42.666667 0 0 1 37.333333-13.653333 42.666667 42.666667 0 0 1 32.426667 23.04A448 448 0 0 1 512 960z m0-533.333333a85.333333 85.333333 0 0 0-60.373333 145.706666 87.466667 87.466667 0 0 0 120.746666 0l2.133334-2.133333 1.066666-1.493333A85.333333 85.333333 0 0 0 512 426.666667z"/>
  </g>
</svg>