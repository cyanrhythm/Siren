<?xml version="1.0" encoding="UTF-8"?>
<!--
  Siren 应用图标

  设计意象：深海
  - 深海的窒息与压迫感：背景由深海蓝向下沉入近黑，形成“下坠”的重力感
  - 微弱冷光：符号用冷白微青（#DCEBF7），而非刺目的纯白，
    呼应深海生物的生物荧光，避免与暗底形成廉价的高对比
  - 符号：音乐播放符号

  视图框 1024×1024，四周留白约 250px
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Siren">
  <title>Siren</title>
  <desc>音乐播放器图标：深海蓝黑渐变底上的冷白音符</desc>

  <defs>
    <!--
      深海渐变：三段式，从上方的深海蓝沉入下方的近黑
      中点刻意偏低（55%），制造“越往下越黑”的沉坠感
    -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A2A43"/>
      <stop offset="55%" stop-color="#061829"/>
      <stop offset="100%" stop-color="#010409"/>
    </linearGradient>

    <!-- 左上角极淡的冷光，模拟水面透下的微弱光线 -->
    <radialGradient id="surfaceLight" cx="22%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 圆角方形底 -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#surfaceLight)"/>

  <!--
    音乐播放符号（居中于 x=512，y=512）
    来自用户提供的新路径，保持原始比例并居中
  -->
  <g fill="#ff0000" transform="translate(0, 0)">
    <path d="M512 960A448 448 0 1 1 802.133333 170.666667a42.666667 42.666667 0 0 1-55.466666 65.493333 362.666667 362.666667 0 1 0 112 170.666667l-226.346667 226.133333a170.666667 170.666667 0 1 1 44.16-164.906667l165.546667-167.04a42.666667 42.666667 0 0 1 37.333333-13.653333 42.666667 42.666667 0 0 1 32.426667 23.04A448 448 0 0 1 512 960z m0-533.333333a85.333333 85.333333 0 0 0-60.373333 145.706666 87.466667 87.466667 0 0 0 120.746666 0l2.133334-2.133333 1.066666-1.493333A85.333333 85.333333 0 0 0 512 426.666667z" fill="#ff0000"/>
  </g>
</svg>