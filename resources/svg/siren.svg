<?xml version="1.0" encoding="UTF-8"?>
<!--
  Siren 应用图标

  设计意象：深海
  - 深海的窒息与压迫感：背景由深海蓝向下沉入近黑，形成"下坠"的重力感
  - 微弱冷光：符号用冷白微青（#DCEBF7），而非刺目的纯白，
    呼应深海生物的生物荧光，避免与暗底形成廉价的高对比
  - 符号：八分音符（符头 + 符干 + 符尾）

  视图框 1024×1024，四周留白约 250px
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Siren">
  <title>Siren</title>
  <desc>音乐播放器图标：深海蓝黑渐变底上的冷白音符</desc>

  <defs>
    <!--
      深海渐变：三段式，从上方的深海蓝沉入下方的近黑
      中点刻意偏低（55%），制造"越往下越黑"的沉坠感
    -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A2A43"/>
      <stop offset="55%" stop-color="#061829"/>
      <stop offset="100%" stop-color="#010409"/>
    </linearGradient>

    <!-- 左上角极淡的冷光，模拟水面透下的微弱光线 -->
    <radialGradient id="surfaceLight" cx="22%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 圆角方形底 -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#surfaceLight)"/>

  <!--
    八分音符（水平居中于 x=512）

    符干 x:554..608，y:250..680
    符尾自符干顶端向右下弯出，末端收细至约 (754, 452)
    符头中心 (426, 664)
  -->
  <g fill="#DCEBF7">
    <!-- 符干 -->
    <rect x="554" y="250" width="54" height="430" rx="8"/>

    <!-- 符尾：贴合符干顶端，向右下弯曲收细 -->
    <path d="M 560 250
             C 664 262, 746 330, 754 452
             C 750 388, 704 330, 608 314
             L 608 250
             Z"/>

    <!-- 符头 -->
    <ellipse cx="426" cy="664" rx="160" ry="120" transform="rotate(-20 426 664)"/>
  </g>
</svg>
