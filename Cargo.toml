[workspace]
resolver = "2"
members = [
    "crates/siren-app",
    "crates/siren-core",
    "crates/siren-platform",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/cyanrhythm/Siren"
authors = ["cyanrhythm"]

[workspace.dependencies]
# 内部 crate
siren-app = { path = "crates/siren-app" }
siren-core = { path = "crates/siren-core" }
siren-platform = { path = "crates/siren-platform" }

# ── 待补充：外部依赖 ─────────────────────────────────────────────
# UI / 渲染
# gpui-kit = "0.7"
#
# 平台能力
# tray-icon = "0.26"
# directories = "6"
# global-hotkey = "0.8"
# auto-launch = "0.6"
# playwire = "2"
# zbus = "5"
#
# 音频
# (libmpv 绑定待 PoC 后确定)
#
# 网络 / 序列化
# reqwest = { version = "0.12", features = ["json"] }
# serde = { version = "1", features = ["derive"] }
# serde_json = "1"
#
# 异步
# tokio = { version = "1", features = ["full"] }
# futures = "0.3"

# ── 加密（siren-core，已落地）────────────────────────────────────
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
ecb = { version = "0.1", features = ["alloc"] }
cipher = "0.4"
base64 = "0.22"
hex = "0.4"
md-5 = "0.10"
rand = "0.8"
num-bigint = "0.4"
num-traits = "0.2"

# ── 序列化 / 网络（siren-core，规划中）──────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "http2"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
directories = "6"

# ── 音频（siren-core，运行时动态加载 libmpv）────────────────────
libloading = "0.8"

# ── 平台（siren-platform，libc 仅 unix 使用）────────────────────
libc = "0.2"

# 系统媒体控制（SMTC / MPRIS / Now Playing 统一 API）
playwire = "2"

# 原生窗口句柄（GPUI 实现 raw-window-handle，供 SMTC 使用）
raw-window-handle = "0.6"

# ── UI（siren-app）──────────────────────────────────────────────
gpui-kit = "0.7"

# ── 构建配置 ────────────────────────────────────────────────────

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1

# 依赖在 dev 构建中也优化，避免 UI 卡顿
[profile.dev.package."*"]
opt-level = 2
