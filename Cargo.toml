[workspace]
resolver = "2"
members = [
    "crates/siren-app",
    "crates/siren-core",
    "crates/siren-platform",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/cyanrhythm/Siren"
authors = ["cyanrhythm"]

[workspace.dependencies]
# 内部 crate
siren-core = { path = "crates/siren-core" }
siren-platform = { path = "crates/siren-platform" }

# ── 加密（siren-core，已落地）────────────────────────────────────
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
ecb = { version = "0.1", features = ["alloc"] }
cipher = "0.4"
base64 = "0.22"
hex = "0.4"
md-5 = "0.10"
rand = "0.8"
num-bigint = "0.4"

# ── 序列化 / 网络（siren-core，规划中）──────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "http2", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
directories = "6"

# 歌词解析（siren-core）
regex = "1"

# ── 日志（siren-core / siren-app）───────────────────────────────
log = { version = "0.4", features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# ── 二维码登录（siren-core）────────────────────────────────────
qrcode = { version = "0.14", default-features = false }
png = "0.17"

# ── 音频（siren-core，运行时动态加载 libmpv）────────────────────
libloading = "0.8"

# ── 平台（siren-platform，libc 仅 unix 使用）────────────────────
libc = "0.2"

# 系统媒体控制（SMTC / MPRIS / Now Playing 统一 API）
playwire = "2"

# 原生窗口句柄（GPUI 实现 raw-window-handle，供 SMTC 使用）
raw-window-handle = "0.6"

# ── UI（siren-app）──────────────────────────────────────────────
gpui-kit = "0.8"

# ── 构建期（siren-app build.rs）─────────────────────────────────
# Windows exe 的图标 + 版本信息。Tauri 维护的 winres 分支，内部委托
# `embed-resource` 做工具链探测（MSVC / GNU / LLVM 全覆盖），
# 版本字段默认取自 CARGO_PKG_VERSION。
tauri-winres = "0.3"

# ── 构建配置 ────────────────────────────────────────────────────

[profile.release]
lto = true
codegen-units = 1
strip = true
# abort 取舍：发布体积更小、无 unwind 表；代价是任何 panic（含 FFI 边界、越界索引）
# 都会直接终止进程，只能靠日志定位。因此 release 下**不允许**把 panic 当控制流
# （如 `unwrap()` 处理可恢复错误）；测试目标不受影响（cargo 对 test/bench 忽略该设置）。
panic = "abort"

[profile.dev]
opt-level = 1

# 依赖在 dev 构建中也优化，避免 UI 卡顿
[profile.dev.package."*"]
opt-level = 2
